<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Red Dead Multiplayer">
  <!-- Red Dead Multiplayer wordmark: an original emblem (revolver cylinder + star) and woodcut-style lettering. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9352a"/>
      <stop offset="0.55" stop-color="#b3261e"/>
      <stop offset="1" stop-color="#7c1812"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d79a"/>
      <stop offset="0.5" stop-color="#c9a15a"/>
      <stop offset="1" stop-color="#8a6a32"/>
    </linearGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>

  <!-- emblem: revolver cylinder with a five-point star -->
  <g transform="translate(110 110)" filter="url(#rough)">
    <circle r="96" fill="#140e0a" stroke="url(#brass)" stroke-width="5"/>
    <circle r="84" fill="none" stroke="url(#brass)" stroke-width="1.5" stroke-dasharray="2 5"/>
    <g fill="#0b0806" stroke="url(#brass)" stroke-width="3">
      <circle cx="0" cy="-56" r="17"/>
      <circle cx="48.5" cy="-28" r="17"/>
      <circle cx="48.5" cy="28" r="17"/>
      <circle cx="0" cy="56" r="17"/>
      <circle cx="-48.5" cy="28" r="17"/>
      <circle cx="-48.5" cy="-28" r="17"/>
    </g>
    <polygon points="0,-30 8.2,-10.4 29,-9.3 12.9,4 18.2,24.3 0,12.8 -18.2,24.3 -12.9,4 -29,-9.3 -8.2,-10.4"
             fill="url(#ink)" stroke="#f1d79a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- lettering -->
  <g filter="url(#rough)">
    <text x="230" y="112" font-family="'Palatino Linotype','Book Antiqua',Georgia,serif" font-weight="700" font-size="84"
          textLength="396" lengthAdjust="spacingAndGlyphs" fill="url(#ink)" stroke="#2a0a07" stroke-width="2" paint-order="stroke">RED DEAD</text>
    <rect x="232" y="132" width="396" height="44" fill="#140e0a" stroke="url(#brass)" stroke-width="2"/>
    <text x="430" y="164" text-anchor="middle" font-family="Bahnschrift,'Segoe UI',sans-serif" font-weight="600"
          font-size="26" textLength="350" lengthAdjust="spacing" fill="#efe4cc">MULTIPLAYER</text>
  </g>
</svg>
