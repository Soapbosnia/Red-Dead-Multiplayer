<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Red Dead Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icon set (hand-drawn for Red Dead Multiplayer): <svg class="i"><use href="#i-name"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-servers" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 9h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7" cy="7.5" r="1.2" fill="currentColor"/><circle cx="7" cy="16.5" r="1.2" fill="currentColor"/><path d="M11 7.5h6M11 16.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <!-- spur rowel -->
      <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 1.8l1.6 5.3 4.9-2.6-2.6 4.9 5.3 1.6-5.3 1.6 2.6 4.9-4.9-2.6L12 20.2l-1.6-5.3-4.9 2.6 2.6-4.9L2.8 11l5.3-1.6-2.6-4.9 4.9 2.6z"/><circle cx="12" cy="11" r="2.6"/></g></symbol>
      <!-- saloon doors -->
      <symbol id="i-quit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 4v16M21 4v16"/><path d="M5 7c2-1 4-1 6 0v9c-2-1-4-1-6 0z"/><path d="M19 7c-2-1-4-1-6 0v9c2-1 4-1 6 0z"/></g></symbol>
      <!-- telegraph pole -->
      <symbol id="i-internet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v18M6 6h12M7.5 10h9"/><path d="M6 6c-2 2-3 3-5 3.5M18 6c2 2 3 3 5 3.5" stroke-width="1.3"/><circle cx="6" cy="6" r=".9" fill="currentColor"/><circle cx="18" cy="6" r=".9" fill="currentColor"/></g></symbol>
      <!-- campfire -->
      <symbol id="i-local" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 3.5 4.5 6 4.5 8.5a4.5 4.5 0 0 1-9 0c0-1.6.7-3 2-4.3.2 1.7 1 2.6 2 3 0-2.5-.2-4.6.5-7.2z"/><path d="M4 21l16-4M20 21L4 17"/></g></symbol>
      <!-- sheriff star -->
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.4 5.6 6.1.5-4.6 4 1.4 6-5.3-3.2-5.3 3.2 1.4-6-4.6-4 6.1-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="M12 2.5l2.4 5.6 6.1.5-4.6 4 1.4 6-5.3-3.2-5.3 3.2 1.4-6-4.6-4 6.1-.5z" fill="currentColor"/></symbol>
      <!-- pocket watch -->
      <symbol id="i-recent" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4.2l2.8 1.8M10.5 3h3M12 3v3"/></g></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></g></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></symbol>
      <!-- cowboy hat -->
      <symbol id="i-player" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M2 15.5c3 2 17 2 20 0"/><path d="M7 15.5c0-4 .7-8.5 2.5-8.5 1 0 1.5 1 2.5 1s1.5-1 2.5-1c1.8 0 2.5 4.5 2.5 8.5"/></g></symbol>
      <symbol id="i-signal" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="15" width="3.5" height="5" rx=".6"/><rect x="8.5" y="11" width="3.5" height="9" rx=".6"/><rect x="14" y="7" width="3.5" height="13" rx=".6"/><rect x="19.5" y="3" width="1.5" height="17" rx=".6" opacity=".5"/></g></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor"/></symbol>
      <symbol id="i-multiplayer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1 13c2 1.4 9 1.4 11 0"/><path d="M3.5 13c0-3 .5-6 1.8-6 .7 0 1 .6 1.7.6s1-.6 1.7-.6c1.3 0 1.8 3 1.8 6"/><path d="M12 18c2 1.4 9 1.4 11 0"/><path d="M14.5 18c0-3 .5-6 1.8-6 .7 0 1 .6 1.7.6s1-.6 1.7-.6c1.3 0 1.8 3 1.8 6"/></g></symbol>
      <symbol id="i-display" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="4" width="19" height="12.5" rx="1.5"/><path d="M8 20.5h8M12 16.5v4"/></g></symbol>
      <!-- lantern -->
      <symbol id="i-graphics" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 4h6M10 4V2.5h4V4M8 6h8l1 3v8l-1 3H8l-1-3V9z"/><path d="M12 10.5c1.4 1.4 1.8 2.6 1.8 3.4a1.8 1.8 0 0 1-3.6 0c0-.8.4-2 1.8-3.4z" fill="currentColor"/></g></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="1.6"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.8h.01M18 10h.01M8.5 14h7"/></g></symbol>
      <symbol id="i-gamepad" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-1 3.3a2.2 2.2 0 0 1-3.8.8L15 15H9l-2 2.5a2.2 2.2 0 0 1-3.8-.8l-1-3.3A5 5 0 0 1 7 7z"/><path d="M8 10v3M6.5 11.5h3"/><circle cx="16" cy="10.5" r=".8" fill="currentColor"/><circle cx="17.5" cy="12.5" r=".8" fill="currentColor"/></g></symbol>
      <!-- horseshoe -->
      <symbol id="i-gameplay" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 20.5V11a5.5 5.5 0 0 1 11 0v9.5"/></g><g fill="currentColor"><circle cx="6.5" cy="13" r=".8"/><circle cx="6.5" cy="16.5" r=".8"/><circle cx="17.5" cy="13" r=".8"/><circle cx="17.5" cy="16.5" r=".8"/></g></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="backdrop"><div class="grain"></div></div>

  <aside class="rail">
    <img class="logo" src="assets/logo.svg" alt="Red Dead Multiplayer">
    <nav class="nav">
      <button class="nav-item active" data-page="servers"><svg class="i"><use href="#i-servers"/></svg><span>Play</span></button>
      <button class="nav-item" data-page="settings"><svg class="i"><use href="#i-settings"/></svg><span>Settings</span></button>
    </nav>
    <div class="rail-foot">
      <div class="who"><svg class="i"><use href="#i-player"/></svg><span id="who-name">player</span></div>
      <button class="nav-item quiet" id="quit"><svg class="i"><use href="#i-quit"/></svg><span>Quit</span></button>
      <div class="version" id="version"></div>
    </div>
  </aside>

  <main class="main">
    <!-- ================= Play (server browser) ================= -->
    <section class="page active" id="page-servers">
      <header class="head">
        <div>
          <div class="eyebrow">Multiplayer</div>
          <h1>Find a server</h1>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-list="internet"><svg class="i"><use href="#i-internet"/></svg>Internet</button>
          <button class="tab" data-list="local"><svg class="i"><use href="#i-local"/></svg>Local</button>
          <button class="tab" data-list="favorites"><svg class="i"><use href="#i-star"/></svg>Favorites</button>
          <button class="tab" data-list="recent"><svg class="i"><use href="#i-recent"/></svg>Recent</button>
        </div>
      </header>

      <div class="browser">
        <div class="list-col">
          <div class="toolbar">
            <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search by name or address" autocomplete="off" spellcheck="false"></label>
            <label class="check"><input type="checkbox" id="hide-empty"><span>Hide empty</span></label>
            <label class="check"><input type="checkbox" id="hide-locked"><span>Hide locked</span></label>
            <button class="btn icon" id="refresh" title="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
          </div>
          <div class="table-wrap">
            <table class="servers">
              <thead>
                <tr>
                  <th class="c-fav"></th>
                  <th class="sortable" data-sort="name">Server</th>
                  <th class="c-players sortable" data-sort="players">Players</th>
                  <th class="c-ping sortable" data-sort="ping">Ping</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
            <div class="empty" id="empty"></div>
          </div>
          <div class="count" id="count"></div>
        </div>

        <aside class="detail" id="detail">
          <div class="poster" id="poster">
            <div class="poster-top">Server</div>
            <h2 id="d-name">No server selected</h2>
            <div class="poster-addr" id="d-addr">Pick one from the list, or connect directly below.</div>
            <dl class="facts" id="d-facts" hidden>
              <div><dt>Players</dt><dd id="d-players"></dd></div>
              <div><dt>Ping</dt><dd id="d-ping"></dd></div>
              <div><dt>Version</dt><dd id="d-version"></dd></div>
              <div><dt>Access</dt><dd id="d-access"></dd></div>
            </dl>
            <div class="poster-actions">
              <button class="btn" id="favorite-toggle" disabled><svg class="i"><use href="#i-star"/></svg><span>Favorite</span></button>
              <button class="btn primary" id="connect" disabled><svg class="i"><use href="#i-play"/></svg><span>Join</span></button>
            </div>
          </div>
          <div class="direct">
            <div class="label-sm">Direct connect</div>
            <div class="direct-row">
              <input id="address" type="text" placeholder="host:port" spellcheck="false" autocomplete="off">
              <button class="btn" id="direct-connect">Connect</button>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ================= Settings ================= -->
    <section class="page" id="page-settings">
      <header class="head">
        <div>
          <div class="eyebrow">Options</div>
          <h1>Settings</h1>
        </div>
      </header>
      <div class="settings">
        <nav class="subnav" id="subnav"></nav>
        <div class="panel" id="panel"></div>
      </div>
      <footer class="applybar" id="applybar">
        <span id="dirty-text">No changes</span>
        <div class="applybar-actions">
          <button class="btn" id="revert" disabled>Revert</button>
          <button class="btn primary" id="apply" disabled>Apply</button>
        </div>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <div class="modal" id="password-modal" hidden>
    <div class="modal-box">
      <button class="modal-x" id="password-cancel" title="Cancel"><svg class="i"><use href="#i-close"/></svg></button>
      <svg class="i big"><use href="#i-lock"/></svg>
      <h2>Password required</h2>
      <p id="password-for"></p>
      <input id="password" type="password" autocomplete="off" placeholder="Server password">
      <div class="modal-actions"><button class="btn primary" id="password-ok">Join</button></div>
    </div>
  </div>

  <div class="modal" id="keep-modal" hidden>
    <div class="modal-box">
      <svg class="i big"><use href="#i-display"/></svg>
      <h2>Keep these display settings?</h2>
      <p>Reverting in <b id="keep-seconds">15</b> seconds.</p>
      <div class="modal-actions">
        <button class="btn" id="keep-revert">Revert</button>
        <button class="btn primary" id="keep-ok">Keep</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
