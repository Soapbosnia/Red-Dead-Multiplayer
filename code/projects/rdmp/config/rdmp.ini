[boot]
; Root script the game boots into instead of the story/front-end script "$/content/main".
; "$/content/sp_idle" = the game's own idle single-player script (world loads, no story, no player).
; Leave empty to keep the game's normal choice (story + missions).
root_script=$/content/sp_idle

[game]
; Full path of RDR.exe. Empty = RDMP.exe looks next to and above itself, then asks once and saves the answer here.
exe=
; 1 = our own game loop + boot: Game::Run replaced, no legals/logo controller in Init, our loading-mode frame
;     (no legal pages, logo video, PressStart front-end script or loading-screen drawing ever runs)
own_loop=1
; world streaming time (ms) after the level load starts, before the load is finished and the player spawns
stream_ms=8000

[sandbox]
; 1 = sandbox boot: finish the loading screen automatically and spawn only the player (use with sp_idle).
enabled=1
; 1 = skip the legal screen and the title screen (boots straight into the world)
skip_menus=2
; skip_menus=2: UI event that triggers the direct start
direct_start_event=none
; 1 = legal pages + Rockstar logo are not drawn (their logic still runs, so the platform sign-in finishes as usual)
skip_legals=1
; 1 = black screen with a LOADING indicator over the game window until the player is in the world (hides the boot logos)
loading_overlay=0
; 1 = every Bink video ends the moment it opens (normal "video finished" path)
skip_videos=1
; 1 = the loading screen (brush art + revolver) is not drawn; its logic still runs
hide_loading_screen=1
; 1 = the title screen (RED DEAD REDEMPTION logo) is not drawn
hide_title_screen=1
; 1 = engine fader: black when the player spawns, held fade_hold_ms (camera settles), then fades into the world over fade_in_ms
engine_fade=1
fade_in_ms=1500
fade_hold_ms=1000
auto_finish_loading=1
; Time (ms) to let the world stream in after the world load starts, before ending the loading screen.
finish_delay_ms=8000
; Handle of the object the player is created into. 808 = the one the story script uses (makes it the local player).
; 0 = first Layout in the game-object table (creates an actor that is NOT the local player).
owner_handle=808
spawn_player=1
; MTA-style join: park the player underground with the screen black until the script calls spawnPlayer
limbo_spawn=1
limbo_pos=0 -300 0
; test: puppets spawned right after the player (same moment)
puppets_at_spawn=0
; Actor definition for remote-player puppets. 0 = template_player (Marston model; created as NON-player, safe).
; 3 = template_base_human (has an AI brain from the start).
puppet_def=0
; Model variation for puppets (-1 = 0,1,2,... per F9 spawn, for comparing) and for the player (story uses 12).
puppet_variation=12
player_variation=12
; Values captured from the story script's own player spawn.
player_actor_type=808
; spawn = where the story first places John: Armadillo Station (train arrival), heading -100.3 (from the story intro, pos_log)
; (old value: 736.49, 89.17, 1199.33 = the story's placeholder rooftop before the intro)
spawn_x=-2208.91
spawn_y=16.51
spawn_z=2605.41
spawn_heading=-100.3
; radar (minimap) zoom = diameter of the radar view in metres (story scripts set this; the engine default 1.2 m looks blank)
radar_zoom=150
; 1 = the world keeps running behind the pause menu (multiplayer); 0 = the game freezes like single player
no_pause_freeze=1
; Local player respawns at the spawn point this long after dying (ms). 0 = never: the "wasted" script respawns players.
respawn_delay_ms=0

[debug]
; old reverse-engineering hotkeys F5..F11 (probes, puppets); off so F7..F9 stay free for scripts
re_keys=0
fader_log=0
fade_color_test=0
ui_draw_log=0
; UI scene to hide at the world-load InTransitionComplete (experiments)
hide_scene=
signin_log=0
scene_report=0
; 1 = when loading starts, watch writes to the local player's actor handle (playerInfo+0x5ec)
;     with a CPU debug register and log the writing code + call stack.
watch_player_handle=0
; 1 = log every script native the first time it is called (debug)
log_natives=0
; 1 = trace the 600 native calls after a script creates the player (debug)
trace_after_player=0
watch_move=0
collision_probe=0
radar_trace=0

[net]
; Multiplayer client. Without autoconnect the game opens the main menu (server browser); name is the nickname the
; menu's Settings page edits.
enabled=1
; 1 = connect straight to server:port at start and keep retrying (development); 0 = the main menu picks the server
autoconnect=0
server=127.0.0.1
port=27015
name=player
; 1 = RDMP.exe starts RDMPServer.exe (next to it) first when server=127.0.0.1 and none is running yet
start_local_server=1
; Folder holding rdmp_client.dll and the Framework runtime DLLs. Empty = the folder this rdmp.ini is in.
fw_dir=
; Interpolation buffer (ms): remote players are drawn this far behind their newest update (timed by when the sender's
; game captured it). Must cover the update spacing + jitter.
interp_ms=30
; Distance streaming of remote players (m, horizontal): actor created within stream_in, released beyond stream_out.
stream_in=150
stream_out=200
; Remote puppets are pulled onto the network position every frame (keeps their walk/run animation); lead_ms predicts
; that far ahead along their velocity to cover the network delay. auto = interp_ms + both players' ping / 2 + one server
; tick; a number fixes it (0 = none). puppet_nudge=0 turns the pull off.
puppet_nudge=1
lead_ms=auto

[client]
; Written by the main menu's Settings page.
nametags=1
nametag_distance=60
chat=1

[browser]
; Internet tab: the MafiaHub masterlist, filtered to servers of this gamemode.
masterlist=https://masterlist.mafiahub.dev
gamemode=rdmp
